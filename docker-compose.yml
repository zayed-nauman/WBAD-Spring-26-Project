version: '3.9'
services:
  backend:
    build:
      context: ./backend
      args:
        - NODE_ENV=production
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - 3000:3000
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/
    ports:
      - 80:80
    depends_on:
      - backend
